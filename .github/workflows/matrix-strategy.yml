name: Matrix strategy test

on: workflow_dispatch

jobs:
    deploy:
        strategy:
            matrix:
                os: [ubuntu-latest, ubuntu-20.4, windows-latest]
                images: [hello-world, alpine]
    runs-on: ${{ matrix.os }}
    steps:
        - name: Chek docker info on ${{ matrix.os }} server
          run: docker info
        
        - name: Run the image ${{ matrix.images }}
          run: docker run ${{ matrix.images }}